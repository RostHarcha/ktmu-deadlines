services:
  caddy:
    ports:
      - "8040:80"

  migrate:
    image: ktmu-deadlines/backend:local
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic

  backend:
    image: ktmu-deadlines/backend:local
    environment:
      ENVIRONMENT: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
